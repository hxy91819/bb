name: Release fork aggregate

on:
  push:
    tags:
      - "fork-v*"

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'hxy91819/bb'
    name: Runtime (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Verify release target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e '
            if (!/^fork-v[0-9][A-Za-z0-9._-]*$/u.test(process.env.RELEASE_TAG)) throw new Error("Invalid fork release tag");
            if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected runner architecture");
          '
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test fork maintenance
        run: node --test scripts/fork-maintenance.test.mjs
      - name: Typecheck and test launcher
        run: pnpm exec turbo run typecheck test --filter=bb-app --concurrency=1 --output-logs=errors-only
      - name: Build and verify packed application
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --concurrency=1 --output-logs=errors-only
      - name: Package standalone runtime
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/fork-release/package-runtime.mjs . release "$RELEASE_TAG"
      - name: Verify extracted runtime
        run: node scripts/fork-release/smoke-runtime.mjs release/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/fork-release/publish.sh
