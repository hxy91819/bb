name: Check fork maintenance

on:
  push:
    branches:
      - "refactor/fork-build-flow"

permissions:
  contents: read

concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.repository == 'hxy91819/bb'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Prepare user systemd for maintenance regressions
        run: bash scripts/fork-release/prepare-user-systemd.sh
      - name: Repeat prepared user systemd setup
        run: bash scripts/fork-release/prepare-user-systemd.sh
      - name: Verify kernel resource limits
        run: scripts/run-resource-isolated --profile package -- node scripts/fork-release/verify-resource-scope.mjs
      - name: Test fork maintenance
        run: scripts/run-resource-isolated --profile package -- node --test scripts/resource-profile.test.mjs scripts/fork-maintenance.test.mjs scripts/fork-flow.test.mjs
